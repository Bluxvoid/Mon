name: Build GBA ROM
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          export PATH=$PATH:/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin
          arm-none-eabi-gcc -O2 -mthumb -mthumb-interwork -specs=gba.specs main.c -o game.elf
          arm-none-eabi-objcopy -O binary game.elf game.gba
          gbafix game.gba
      - uses: actions/upload-artifact@v4
        with:
          name: creature-quest-gba
          path: game.gba
